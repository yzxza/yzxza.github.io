<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" role="img" aria-label="圣沃尔夫冈在湖北岸，巴士只走南岸，两岸靠船连" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA6A1"/></marker></defs>
<rect x="0" y="0" width="760" height="426" fill="#FFFFFF"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#15211D">圣沃尔夫冈在湖北岸，巴士只走南岸，两岸靠船连</text>
<text x="24" y="50" font-size="11.5" fill="#5D6B65">一天的顺序：① 圣吉尔根 → ② 圣沃尔夫冈·上山 → ③ 滑草场 → 沿公路回萨尔茨堡</text>
<rect x="200" y="70" width="200" height="40" rx="8" fill="none" stroke="#9AA6A1" stroke-width="1.25"/>
<text x="300" y="95" text-anchor="middle" fill="#15211D">沙夫山 1783 m</text>
<line x1="300" y1="126" x2="300" y2="112" stroke="#9AA6A1" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="170" y="126" width="260" height="56" rx="8" fill="#1C6373" fill-opacity="0.12" stroke="#1C6373" stroke-width="2"/>
<text x="300" y="150" text-anchor="middle" font-weight="600" fill="#15211D">② 圣沃尔夫冈 St. Wolfgang</text>
<text x="300" y="166" text-anchor="middle" font-size="11.5" fill="#5D6B65">小火车山下站 · 两个码头</text>
<line x1="300" y1="182" x2="300" y2="204" stroke="#9AA6A1" stroke-width="1.25"/>
<rect x="40" y="200" width="680" height="72" rx="24" fill="#EDF2F1" stroke="#9AA6A1" stroke-width="1.25"/>
<text x="60" y="224" font-size="11.5" fill="#5D6B65">沃尔夫冈湖</text>
<path d="M151 262L300 208L380 262L609 262" fill="none" stroke="#1C6373" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="151" cy="262" r="4" fill="#1C6373"/><circle cx="300" cy="208" r="4" fill="#1C6373"/><circle cx="380" cy="262" r="4" fill="#1C6373"/><circle cx="609" cy="262" r="4" fill="#1C6373"/>
<line x1="151" y1="262" x2="151" y2="300" stroke="#9AA6A1" stroke-width="1.25" stroke-dasharray="3 4"/>
<line x1="380" y1="262" x2="380" y2="300" stroke="#9AA6A1" stroke-width="1.25" stroke-dasharray="3 4"/>
<line x1="609" y1="262" x2="609" y2="300" stroke="#9AA6A1" stroke-width="1.25" stroke-dasharray="3 4"/>
<text x="40" y="292" font-size="11.5" fill="#5D6B65">← 萨尔茨堡</text>
<text x="720" y="292" text-anchor="end" font-size="11.5" fill="#5D6B65">巴德伊舍 →</text>
<rect x="40" y="300" width="680" height="102" rx="8" fill="none" stroke="#9AA6A1" stroke-width="1.25"/>
<text x="56" y="320" font-size="11.5" fill="#5D6B65">南岸公路 B158 · 150 路巴士</text>
<rect x="56" y="330" width="190" height="56" rx="8" fill="none" stroke="#9AA6A1" stroke-width="1.25"/>
<text x="151" y="354" text-anchor="middle" font-weight="600" fill="#15211D">① 圣吉尔根 St. Gilgen</text>
<text x="151" y="370" text-anchor="middle" font-size="11.5" fill="#5D6B65">下巴士，走 300 米上船</text>
<rect x="285" y="330" width="190" height="56" rx="8" fill="none" stroke="#9AA6A1" stroke-width="1.25"/>
<text x="380" y="354" text-anchor="middle" font-weight="600" fill="#15211D">③ Gschwendt 滑草场</text>
<text x="380" y="370" text-anchor="middle" font-size="11.5" fill="#5D6B65">码头和巴士站都在旁边</text>
<rect x="514" y="330" width="190" height="56" rx="8" fill="none" stroke="#9AA6A1" stroke-width="1.25"/>
<text x="609" y="354" text-anchor="middle" font-weight="600" fill="#15211D">Strobl</text>
<text x="609" y="370" text-anchor="middle" font-size="11.5" fill="#5D6B65">船的终点，可换 150 路</text>
</svg>
